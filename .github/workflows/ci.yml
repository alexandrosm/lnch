name: ci

on:
  push:
  pull_request:

jobs:
  windows-tests:
    runs-on: windows-latest
    env:
      STARTER_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Engine matrix (Windows PowerShell 5.1)
        shell: powershell
        run: tests/run-tests.ps1

      - name: Cross-shell shims (pwsh + Git-bash/cmd children)
        shell: pwsh
        run: tests/run-tests-crossshell.ps1

      - name: Doctor smoke
        shell: pwsh
        run: |
          . ./Start-Project.ps1
          start -Doctor

      - name: Remote bootstrap smoke (published one-liner path)
        shell: pwsh
        run: |
          # exercise the real download+install flow (fetches current main)
          ./bootstrap.ps1
          $installed = Join-Path $env:USERPROFILE '.project-starter'
          if (-not (Test-Path (Join-Path $installed 'Start-Project.ps1'))) { throw 'bootstrap did not install the engine' }
          . (Join-Path $installed 'Start-Project.ps1')
          if (-not (${function:start})) { throw 'installed engine did not define start' }
