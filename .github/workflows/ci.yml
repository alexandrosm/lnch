name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-tests:
    runs-on: windows-latest
    env:
      LNCH_DIR: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings tests/PSScriptAnalyzerSettings.psd1
          $findings | Format-Table -AutoSize | Out-String | Write-Output
          if ($findings | Where-Object Severity -eq 'Error') { exit 1 }

      - name: Engine matrix (Windows PowerShell 5.1)
        shell: powershell
        run: tests/run-tests.ps1

      - name: Cross-shell shims (pwsh + Git-bash/cmd children)
        shell: pwsh
        run: tests/run-tests-crossshell.ps1

      - name: Installed user journey (checkout payload)
        shell: pwsh
        run: ./tests/run-tests-installed.ps1 -InstallDir $env:GITHUB_WORKSPACE

      - name: Tagged Bash bootstrap archive smoke
        shell: bash
        run: bash tests/run-tests-bootstrap.sh

      - name: Doctor smoke
        shell: pwsh
        run: |
          . ./Lnch.ps1
          lnch -Doctor

      - name: Remote bootstrap smoke (published one-liner path)
        shell: pwsh
        run: |
          # exercise the real download+install flow against pushed main
          ./bootstrap.ps1 -Version main
          $installed = Join-Path $env:USERPROFILE '.lnch'
          if (-not (Test-Path (Join-Path $installed 'Lnch.ps1'))) { throw 'bootstrap did not install the engine' }
          . (Join-Path $installed 'Lnch.ps1')
          if (-not (${function:lnch})) { throw 'installed engine did not define lnch' }
          ./tests/run-tests-installed.ps1 -InstallDir $installed
