name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package tagged tree (git archive)
        shell: pwsh
        run: |
          $tag = ${env:GITHUB_REF_NAME}
          git archive --format=zip "--output=project-starter-$tag.zip" $tag
          $hash = (Get-FileHash "project-starter-$tag.zip" -Algorithm SHA256).Hash
          "$hash  project-starter-$tag.zip" | Set-Content SHA256SUMS
          Get-ChildItem project-starter-*.zip, SHA256SUMS | Format-Table Name, Length

      - name: Create or update release with assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = ${env:GITHUB_REF_NAME}
          gh release create $tag "project-starter-$tag.zip" SHA256SUMS `
            --title $tag --generate-notes --verify-tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Output 'release exists - replacing assets'
            gh release upload $tag "project-starter-$tag.zip" SHA256SUMS --clobber
          }
